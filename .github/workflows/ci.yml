name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: npm test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: Check the shipped example output
        run: npm run check-output -- --config examples/brand.config.json $(find examples/out -name '*.csv' -o -name '*.md' -path '*/email/*' | sort)
      - name: Check the sample dashboard data matches examples/out
        run: npm run build-sample -- --check
      - name: Check the v1 test fixture still upgrades
        run: npm run check-upgrade -- tests/fixtures/dashboard-data.v1.json
